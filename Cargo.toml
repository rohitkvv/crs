[package]
name = "crs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.14.0"
bson = { version = "2.13.0", features = ["uuid-1", "chrono-0_4"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
futures = "0.3.32"
log = "0.4.33"
mongodb = {version = "3.7.0", features = ["tracing-unstable"]}
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.4", features = ["v8", "fast-rng", "macro-diagnostics", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
